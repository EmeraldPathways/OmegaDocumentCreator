services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../apps/api
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FILE_STORAGE_PATH: /data/clients
      BACKUP_PATH: /data/backups
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${CLIENT_FILES_HOST_PATH}:/data/clients
      - ${BACKUPS_HOST_PATH}:/data/backups
      - ../../templates/docx:/app/templates/docx
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ../../apps/frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # --- Cloudflare Tunnel (optional — enable for remote access) ---
  # 1. Run infra/cloudflared/setup-tunnel.sh to create your tunnel
  # 2. Set ENVIRONMENT=production and REMOTE_ACCESS_MODE=remote in .env
  # 3. Uncomment the cloudflared service block below
  # 4. Replace YOUR_TUNNEL_UUID with the actual UUID from setup-tunnel.sh
  #    (the credentials JSON file is at infra/cloudflared/YOUR_TUNNEL_UUID.json)
  #
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   command: tunnel --config /etc/cloudflared/config.yaml run
  #   volumes:
  #     - ../cloudflared/config.yaml:/etc/cloudflared/config.yaml:ro
  #     - ../cloudflared/YOUR_TUNNEL_UUID.json:/etc/cloudflared/YOUR_TUNNEL_UUID.json:ro
  #   depends_on:
  #     - api
  #     - frontend
  #   # No ports exposed — cloudflared connects outbound to Cloudflare

volumes:
  postgres_data:
